name: AI-Teaching Codex runtime image

on:
  push:
    branches: [develop]
    paths:
      - "codex-rs/**"
      - "integrations/ai-teaching/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ai-teaching-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-teaching-codex-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish runtime
        run: integrations/ai-teaching/runtime/build-image.sh "${{ steps.image.outputs.tag }}" --push
